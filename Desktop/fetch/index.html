<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Player Data</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
        background-image: url(/undefined\ \(3\).jpeg);
            background-repeat: no-repeat;
            background-size: cover;
            background-position: center;
        }
    </style>
</head>

<body class="relative min-h-screen flex items-center justify-center text-white font-sans">
    <!-- Centered form container -->
    <div
        class="absolute w-11/12 sm:w-2/3 md:w-1/2 lg:w-1/3 top-[15%] flex flex-col items-center gap-6 p-8 rounded-2xl bg-gradient-to-r from-green-700/90 to-green-400/90 shadow-2xl backdrop-blur-sm border border-green-300/30">

        <div class="flex flex-col sm:flex-row gap-3 w-full items-center justify-center">
            <label for="player-name" class="text-lg font-semibold">Enter a player name</label>
            <input type="text" id="player-name" name="player-name"
                class="border border-green-200 bg-white/90 text-black rounded-md px-3 py-2 focus:outline-none focus:ring-2 focus:ring-green-500 w-48 sm:w-60">
        </div>

        <button onclick="getData()"
            class="bg-green-500 hover:bg-green-600 text-white font-semibold px-6 py-2 rounded-lg shadow-md transition-transform hover:scale-105">
            Get Data
        </button>
    </div>
    <div class="absolute border-black border-2 h-[300px] w-[300px] top-[50%] flex flex-col items-center gap-3 bg-gradient-to-r from-green-700/90 to-green-400/90 rounded-2xl shadow-[5px_5px_10px_black] hidden py-2" id="player-container"></div>

    <script src="script.js"></script>
</body>

</html>
